# .github/workflows/nextjs.yml

name: Deploy Nextra Site to GitHub Pages

on:
  # Runs on pushes targeting the main branch
  push:
    branches: [main] # Or your default branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # The URL for the deployed site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 8 # Specify your desired pnpm version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your desired Node.js version (LTS recommended)
          cache: 'pnpm' # Enable caching for pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile # Use --frozen-lockfile for CI consistency

      - name: Build Nextra Site
        run: pnpm build # Assumes your build script is 'next build && next export' or similar
                       # Nextra often configures Next.js for static export.
                       # Ensure your package.json's build script creates a static site
                       # (usually in the 'out' directory).
      - name: Export Nextra Site
        run: pnpm export

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the directory generated by the build command.
          # This is typically 'out' for Next.js static exports.
          # Adjust if your build process outputs to a different directory.
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # No 'with' section needed; the action automatically deploys
        # the artifact uploaded in the previous step.
